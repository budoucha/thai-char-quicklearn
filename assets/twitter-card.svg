<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">タイ文字超速習 — 子音 ก の読み方</title>
  <desc id="desc">子音 ก と、ph、k、kh、w の4つの選択肢が表示されたタイ文字学習ドリルの画面。</desc>
  <rect width="1200" height="630" fill="#111315"/>
  <text x="50" y="43" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="24" font-weight="800">タイ文字超速習</text>
  <text x="1150" y="43" text-anchor="end" fill="#a1a1aa" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="16" letter-spacing="2">THAI READING DRILL</text>
  <rect x="40" y="70" width="1120" height="520" rx="22" fill="#181b1f" stroke="#34373d"/>
  <text x="70" y="112" fill="#a8c3ff" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="17">STAGE 1B</text>
  <text x="70" y="145" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="26" font-weight="700">この子音を読め</text>
  <text x="800" y="112" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="16">連続 0/10</text>
  <rect x="900" y="91" width="64" height="34" rx="17" fill="none" stroke="#34373d"/>
  <text x="932" y="113" text-anchor="middle" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="16">子音</text>
  <text x="986" y="112" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="16">正答 0/0</text>
  <rect x="1060" y="91" width="74" height="34" rx="17" fill="none" stroke="#34373d"/>
  <text x="1097" y="113" text-anchor="middle" fill="#f4f4f5" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Noto Sans JP',sans-serif" font-size="15">SCORE 0</text>
  <text x="600" y="300" text-anchor="middle" fill="#f4f4f5" font-family="Tahoma,'Noto Sans Thai','Segoe UI Symbol',sans-serif" font-size="170" font-weight="700">ก</text>
  <rect x="70" y="365" width="515" height="74" rx="13" fill="none" stroke="#34373d"/>
  <rect x="615" y="365" width="515" height="74" rx="13" fill="none" stroke="#34373d"/>
  <rect x="70" y="455" width="515" height="74" rx="13" fill="none" stroke="#34373d"/>
  <rect x="615" y="455" width="515" height="74" rx="13" fill="none" stroke="#34373d"/>
  <g fill="#f4f4f5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="25" text-anchor="middle">
    <text x="327" y="412">ph</text><text x="872" y="412">k</text><text x="327" y="502">kh</text><text x="872" y="502">w</text>
  </g>
  <line x1="70" y1="557" x2="1130" y2="557" stroke="#34373d"/>
</svg>
